name: daily-market

# 每日自动更新插件菜单（中央厨房）
# 需要仓库 Secrets（Settings → Secrets and variables → Actions）：
#   DEEPSEEK_API_KEY  DeepSeek API（LLM 评估）
#   A_GITHUB_TOKEN    个人访问令牌（GitHub API 配额；名字不能以 GITHUB_ 开头，故加前缀）
on:
  schedule:
    - cron: "10 2 * * *"   # 每天 02:10 UTC（北京 10:10）
  workflow_dispatch:        # 也可手动触发

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write      # 允许用内置 token 提交推送
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: 配置 .env（密钥来自 Secrets）
        run: |
          echo "DEEPSEEK_API_KEY=${{ secrets.DEEPSEEK_API_KEY }}" >> .env
          echo "A_GITHUB_TOKEN=${{ secrets.A_GITHUB_TOKEN }}" >> .env

      - name: 跑每日流水线（发现 → 评估 → GitHub 处理 → 报告 → SQLite）
        run: |
          node scripts/npm-scan.mjs --phase discover
          node scripts/npm-scan.mjs --phase llm
          node scripts/process-github-candidates.mjs
          node scripts/report-html.mjs
          node scripts/build-sqlite.mjs || true

      - name: 提交并推送更新
        run: |
          git config user.name "dsh-plgstore-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/plugins.json data/meta.json report.html index.html data/market.db data/reports/ README.md docs/ || true
          git diff --cached --quiet && echo "无变化，跳过提交" || (git commit -m "chore: 每日插件菜单更新 $(date -u +%F)" && git push)
